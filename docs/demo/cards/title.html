<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>COMMON GROUND</title>
  <style>
    html, body { height: 100%; margin: 0; background: #05070b; color: #e9eef6;
      font-family: -apple-system, "SF Pro Text", "Segoe UI", sans-serif; }
    body { display: grid; place-items: center; overflow: hidden; }
    .bg { position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(55% 45% at 18% 8%, rgba(46,242,196,.22), transparent 60%),
        radial-gradient(45% 40% at 88% 12%, rgba(255,184,119,.14), transparent 60%); }
    .card { position: relative; width: min(1100px, 86vw); text-align: left; }
    .kicker { font: 700 14px/1 ui-monospace, monospace; letter-spacing: .18em;
      text-transform: uppercase; color: #2ef2c4; margin: 0 0 22px; }
    h1 { margin: 0; font-size: clamp(40px, 5.4vw, 68px); line-height: 1.12;
      letter-spacing: -.02em; font-weight: 700; }
    h1 em { font-style: normal;
      background: linear-gradient(100deg, #2ef2c4, #7dd3fc 58%, #ffb877);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .eq { display: inline-block; margin-top: 28px; padding: 8px 14px;
      border-radius: 10px; font: 600 18px ui-monospace, monospace; color: #2ef2c4;
      background: rgba(46,242,196,.08); border: 1px solid rgba(46,242,196,.25); }
    p { max-width: 760px; color: #8494a8; font-size: 22px; line-height: 1.5; margin: 22px 0 0; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <p class="kicker">Somnia × DreamDEX · Event Contracts</p>
    <h1>Two people disagree about the future.<br /><em>Can they fund something together?</em></h1>
    <div class="eq">1 Up + 1 Down = 1 collateral</div>
    <p>Instead of betting against each other, they jointly fund a real task.</p>
  </div>
</body>
</html>
